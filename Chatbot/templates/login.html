<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Entrar · {{ nombre_bot }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%2322d3ee' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%2322d3ee'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body class="fondo-hud">
  <main class="pagina-login">
    <div class="orbe orbe-login {{ 'error' if error else '' }}" id="orbe-login">
      {% include "_orbe.html" %}
    </div>
    <h1 class="marca">{{ nombre_bot }}</h1>

    {% if aviso %}
      <div class="aviso" role="alert">
        <strong>{{ aviso }}</strong>
        <p>{{ ayuda }}</p>
      </div>
    {% else %}
      {% if error %}
        <div class="aviso-error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}" id="formulario-login" class="formulario-login">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required autofocus>
        <button type="submit">Entrar</button>
      </form>
    {% endif %}
  </main>
  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
